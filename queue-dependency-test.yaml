apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: queue-dependency-child
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-shared-platform
  path: "./manifests"
  prune: false
  timeout: 10m
  suspend: true  # This will cause it to not be ready
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: queue-dependency-parent
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-shared-platform
  path: "./manifests"
  prune: false
  timeout: 10m
  dependsOn:
  - name: queue-dependency-child
    namespace: flux-system