apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller-queue-test
  namespace: flux-system
  labels:
    control-plane: controller
    app.kubernetes.io/name: kustomize-controller
    app.kubernetes.io/instance: queue-test
    app.kubernetes.io/component: kustomize-controller
spec:
  selector:
    matchLabels:
      app: kustomize-controller-queue-test
  replicas: 1
  template:
    metadata:
      labels:
        app: kustomize-controller-queue-test
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kustomize-controller-queue-test
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1337
      containers:
      - name: manager
        image: ghcr.io/rossigee/kustomize-controller:queue-visibility
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: [ "ALL" ]
          seccompProfile:
            type: RuntimeDefault
        ports:
          - containerPort: 8080
            name: http-prom
            protocol: TCP
          - containerPort: 9440
            name: healthz
            protocol: TCP
        env:
          - name: RUNTIME_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        args:
          - --watch-all-namespaces
          - --log-level=info
          - --log-encoding=json
          - --enable-leader-election
          # Enable queue status features for testing
          - --feature-gates=QueueStatusReporting=true,QueuePositionTracking=true,QueueTimeEstimation=true
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
          - name: temp
            mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kustomize-controller-queue-test
  namespace: flux-system
  labels:
    app.kubernetes.io/name: kustomize-controller
    app.kubernetes.io/instance: queue-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kustomize-controller-queue-test
  labels:
    app.kubernetes.io/name: kustomize-controller
    app.kubernetes.io/instance: queue-test
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kustomize-controller-queue-test
  labels:
    app.kubernetes.io/name: kustomize-controller
    app.kubernetes.io/instance: queue-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kustomize-controller-queue-test
subjects:
- kind: ServiceAccount
  name: kustomize-controller-queue-test
  namespace: flux-system